name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install system dependencies
        run: |
          choco install ffmpeg -y --no-progress
          choco install calibre -y --no-progress

      - name: Download FFmpeg static
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp
          $dir = Get-ChildItem ffmpeg-temp -Directory | Select-Object -First 1
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe" src-tauri\binaries\
          Copy-Item "$($dir.FullName)\bin\ffprobe.exe" src-tauri\binaries\
          Remove-Item ffmpeg.zip, ffmpeg-temp -Recurse -Force

      - name: Setup Python environment
        run: |
          python -m venv venv
          .\venv\Scripts\pip.exe install --upgrade pip setuptools wheel
          .\venv\Scripts\pip.exe install -r python-engine\requirements.txt
          .\venv\Scripts\pip.exe install pyinstaller

      - name: Build Python sidecar
        run: |
          .\venv\Scripts\pyinstaller.exe --onefile --name openconvert-engine --distpath python-engine\dist --workpath python-engine\build --specpath python-engine --clean --noconfirm python-engine\app.py
          Copy-Item python-engine\dist\openconvert-engine.exe src-tauri\binaries\

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenConvert ${{ github.ref_name }}'
          releaseBody: |
            ## OpenConvert ${{ github.ref_name }}

            100% Local, Open Source File Converter

            ### Supported Formats
            - **Images**: PNG, JPG, WEBP, ICO, TIFF, BMP, GIF
            - **Video**: MP4, MKV, AVI, WEBM, MOV, FLV
            - **Audio**: MP3, WAV, FLAC, AAC, OGG, M4A
            - **Documents**: PDF, DOCX, DOC, TXT, RTF, ODT
            - **Ebooks**: EPUB, MOBI, AZW3, PDF
            - **Archives**: ZIP, TAR, GZ, 7Z

            ### Features
            - ✅ 100% Offline - No data leaves your machine
            - ✅ No installation required - Standalone executable
            - ✅ Local REST API server with authentication
            - ✅ 10 Languages supported
            - ✅ Glassmorphism Dark UI
            - ✅ Drag & drop with batch conversion (max 5 files)

            ### Download
            - Windows: `OpenConvert_${{ github.ref_name }}_x64_en-US.msi`

            ---
            Developed by [alexyalex.site](https://alexyalex.site)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install ffmpeg
          brew install --cask calibre

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Setup Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r python-engine/requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        run: |
          source venv/bin/activate
          pyinstaller --onefile --name openconvert-engine --distpath python-engine/dist --workpath python-engine/build --specpath python-engine --clean --noconfirm python-engine/app.py
          cp python-engine/dist/openconvert-engine src-tauri/binaries/

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenConvert ${{ github.ref_name }}'
          releaseBody: |
            ## OpenConvert ${{ github.ref_name }}

            100% Local, Open Source File Converter

            ### Supported Formats
            - **Images**: PNG, JPG, WEBP, ICO, TIFF, BMP, GIF
            - **Video**: MP4, MKV, AVI, WEBM, MOV, FLV
            - **Audio**: MP3, WAV, FLAC, AAC, OGG, M4A
            - **Documents**: PDF, DOCX, DOC, TXT, RTF, ODT
            - **Ebooks**: EPUB, MOBI, AZW3, PDF
            - **Archives**: ZIP, TAR, GZ, 7Z

            ### Features
            - ✅ 100% Offline - No data leaves your machine
            - ✅ No installation required - Standalone executable
            - ✅ Local REST API server with authentication
            - ✅ 10 Languages supported
            - ✅ Glassmorphism Dark UI
            - ✅ Drag & drop with batch conversion (max 5 files)

            ### Download
            - macOS: `OpenConvert_${{ github.ref_name }}_aarch64.dmg`

            ---
            Developed by [alexyalex.site](https://alexyalex.site)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg calibre libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Download FFmpeg static
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg src-tauri/binaries/
          cp ffmpeg-*-amd64-static/ffprobe src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe
          rm -rf ffmpeg-release-amd64-static*

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Setup Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r python-engine/requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        run: |
          source venv/bin/activate
          pyinstaller --onefile --name openconvert-engine --distpath python-engine/dist --workpath python-engine/build --specpath python-engine --clean --noconfirm python-engine/app.py
          cp python-engine/dist/openconvert-engine src-tauri/binaries/

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenConvert ${{ github.ref_name }}'
          releaseBody: |
            ## OpenConvert ${{ github.ref_name }}

            100% Local, Open Source File Converter

            ### Supported Formats
            - **Images**: PNG, JPG, WEBP, ICO, TIFF, BMP, GIF
            - **Video**: MP4, MKV, AVI, WEBM, MOV, FLV
            - **Audio**: MP3, WAV, FLAC, AAC, OGG, M4A
            - **Documents**: PDF, DOCX, DOC, TXT, RTF, ODT
            - **Ebooks**: EPUB, MOBI, AZW3, PDF
            - **Archives**: ZIP, TAR, GZ, 7Z

            ### Features
            - ✅ 100% Offline - No data leaves your machine
            - ✅ No installation required - Standalone executable
            - ✅ Local REST API server with authentication
            - ✅ 10 Languages supported
            - ✅ Glassmorphism Dark UI
            - ✅ Drag & drop with batch conversion (max 5 files)

            ### Download
            - Linux: `OpenConvert_${{ github.ref_name }}_amd64.AppImage`

            ---
            Developed by [alexyalex.site](https://alexyalex.site)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage